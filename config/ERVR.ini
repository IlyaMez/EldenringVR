; ERVR - native VR for ELDEN RING (own OpenXR session; no R.E.A.L. VR required)
; Edit while the game runs: most keys hot-reload within a second.
;
; Install: ReShade (the build WITH add-on support) goes in the game folder as dxgi.dll;
; ERVR.dll is loaded by the dinput8.dll proxy and registers itself as a ReShade add-on.
; If R.E.A.L. VR was installed, remove its files first: dxgi.dll, RealVR64.dll,
; openvr_api.dll, cudart64_12.dll, RealVR.ini.

[General]
Enabled=true
; debug | info | warn | error   (debug prints a heartbeat with controller values every 5 s)
LogLevel=info
; openxr - ERVR creates and owns its own session (Oculus/Link, VDXR and SteamVR all work).
VRRuntime=openxr
PollHz=250

[VR]
; off      - no rendering; ERVR is input/camera only (flat screen)
; cinema   - the flat game on a head-locked quad in the headset. Proves the whole pipeline; also
;            the permanent fallback for menus and cutscenes.
; debugalt - per-eye validation only, NOT the product (M1)
; full     - true stereo, both eyes at the same simulation time (M3)
StereoMode=cinema
; Supersampling of the per-eye images. 1.0 = one eye pixel per delivered game pixel, which is
; all the information there is; raise it only to trade fill rate for slightly softer resampling.
RenderScale=1.0
; 1.0 = metric. Scales the distance between the eyes, so lower values make the world feel larger.
WorldScale=1.0
; Stereo pair rate. 0 = headset refresh / 2 (the compositor reprojects the gap).
PairRateHz=0
; Cinema screen placement, in metres.
CinemaDistance=2.5
CinemaWidth=4.0
; Keep drawing to the monitor as well as the headset.
MirrorWindow=true
; Enable XR_EXT_debug_utils when the runtime offers it (verbose).
XrDebug=false
; Vertical FOV in degrees forced into the game camera while stereo is running. One rendered
; image has to contain a whole eye's field of view; the render thread then crops it down to
; the runtime's exact asymmetric FOV, so too wide only costs sharpness while too narrow costs
; field of view. 0 = AUTO: derive it from the headset (a Quest 3 needs ~110 vs ELDEN RING's
; own 43). Only set a number to override the automatic value.
FovDeg=0
; Which angle the game's camera FOV field means. If the world looks stretched or squashed in
; stereo but is fine in cinema, try the other one.
FovAxis=vertical
; Eye separation in mm, overriding what the runtime reports. 0 = trust the runtime (correct
; unless it is reporting the wrong IPD). Note that if the world merely feels too SMALL, the
; knob you want is WorldScale, not this one - they scale the same thing but mean different
; things, and only this one claims to be your physical IPD.
IpdMm=0
; Back-buffer colour encoding. auto converts gamma-encoded (LDR UNORM) output to the linear
; light the compositor expects - without it everything looks washed out. none | srgb to force.
ColorFix=auto

[Buttons]
; Touch button -> XInput button. Names: A B X Y LB RB LT RT LS RS START BACK DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT none
; Default ELDEN RING bindings: A=interact/confirm B=dodge/sprint X=use item Y=event/two-hand
;   LB=guard RB=light attack LT=skill RT=heavy attack LS=crouch RS=lock-on START=menu BACK=map
A=A
B=B
X=X
Y=Y
LeftStickClick=LS
RightStickClick=RS
; Left "menu" button: tap = START, hold >= MenuHoldForBack seconds = BACK (map).
Menu=START
MenuHoldForBack=0.45
LeftTrigger=LB
RightTrigger=RB
LeftGrip=LT
RightGrip=RT
TriggerThreshold=0.55
GripThreshold=0.60
; Hold left stick click + tilt = D-pad (switch spells / weapons / items). Tap = LS (crouch).
LeftGripPlusStickIsDpad=true

[Sticks]
Deadzone=0.15
Swap=false
RightSensitivity=1.0

[Gestures]
; Swing the right controller to attack: above LightAttackSpeed (m/s) = light attack, above HeavyAttackSpeed = heavy.
; Swing the left controller to send LeftSwingButton (parry / shield bash / offhand attack).
Enabled=true
LightAttackSpeed=2.2
HeavyAttackSpeed=4.0
LeftSwingSpeed=2.4
LightAttackButton=RB
HeavyAttackButton=RT
LeftSwingButton=LB
Cooldown=0.35
PressDuration=0.09
; Only detect swings while that hand's grip is held (avoids accidental swings while gesturing).
RequireGrip=false
Haptics=true

[Movement]
; What "forward" on the move stick means: head (where you look - physically turning your head changes where
; stick-forward walks; what every VR game does), camera (the stick yaw only: physically looking around does NOT
; change the walk direction), hand (where the left controller points), body (where the body is turned, see BodyYaw).
Forward=head
; With CameraTurnByErvr: what the right stick turns - camera (the whole view, like a
; smooth turn) or body (the character only - the view stays where your head points).
RightStick=camera
; The turn stick drives ERVR's own view yaw instead of the game's camera (needs CameraYawSource=ervr, the default).
CameraTurnByErvr=true
TurnSpeed=120
; Right-stick X -> discrete turns of SnapTurnDegrees (or short pulses to the game if CameraTurnByErvr is off).
SnapTurn=false
SnapTurnDegrees=30
SnapTurnPulseSeconds=0.08
SnapTurnRepeatSeconds=0.30
; Rotate the move stick by (view yaw - body yaw). Leave false: ELDEN RING already moves you relative to the camera,
; and the camera is ours, so this only kicks in when the body has turned away (sprint, free-turn) and then makes you
; veer off at an angle.
RelativeToCamera=false

[Locomotion]
; game   = the game moves the character from the (virtual) stick: its own animation, collision, root motion (default)
; direct = ERVR integrates the position itself every frame: stick x/y (in the view frame) x speed, character faces the
;          view. EXPERIMENTAL: the game's collision/ground handling is bypassed for the horizontal motion (height still
;          comes from the game), so expect walking into geometry to misbehave. Only while the stick is pushed; with the
;          stick idle the game owns the character again (rolls, attacks, ladders keep working).
Mode=game
RunSpeed=4.5
SprintSpeed=6.5
; direct: still hand the stick to the game so run/strafe animations play (the game's own displacement is discarded).
FeedStick=true

[Haptics]
RumbleToControllers=true
RumbleScale=1.0

[FirstPerson]
; ERVR takes over the game camera (first person anchored to your character) and drives the arm bones from the
; controllers so the equipped weapons follow your hands. R.E.A.L. keeps doing the stereo rendering + head tracking.
; Only active on eldenring.exe 2.6.2.0 (game 1.16.2) or when the pattern fallbacks resolve; check ERVR.log "[game]".
Enabled=true
; Camera height above the character's root (meters).
EyeHeight=1.60
; Where the camera sits: head = on the character's head bone (the neck/shoulders/arms are under the view by
; construction, whatever the animation does - the way first-person mods do it), root = character root + EyeHeight
; (the body then has to be moved under the camera with BodyFollowsHead, which the run animation fights).
CameraAnchor=head
; Seconds of low-pass on the head-bone anchor (removes per-frame animation jitter, keeps the run lean); 0 = raw.
CameraAnchorSmoothing=0.06
; 0..1: how much of the head bone's own vertical motion (bob, crouch, run lean) the camera follows. 1 = the camera
; stays on the head (shoulders always the same distance below your eyes); 0 = flat (the run animation then drops
; the body ~15 cm under a camera that stays up).
CameraBob=1
; How the first-person camera is handed to the game:
;   pre         write it into the game's character camera, then let the game's camera step run (R.E.A.L.-friendly, default)
;   post        run the game's camera step, then overwrite the final camera
;   block       replace the camera step entirely (erfps2 style; R.E.A.L. falls back to a flat screen with this)
;   passthrough do nothing to the camera (diagnostics: logs the game's own matrices)
CameraMode=pre
; Rotation written into the game camera: hmd (required - ERVR renders, so nothing else applies your head
; rotation), yaw (stick yaw only; no head tracking), game (also keep the game's pitch).
CameraRotation=hmd
; Where the view yaw comes from: ervr = ERVR's own yaw, integrated from the right stick (default; with OwnChrCam the
; game has no camera logic left that could move it, so view, body, hands and movement all sit on one number),
; game = read the game camera's yaw back (the right stick then goes to the game; its follow cam turns the view
; whenever the character moves).
CameraYawSource=ervr
; Put our camera back immediately after the game's follow-cam function writes its own (the follow cam is what turned
; the view when you walked at an angle, and it writes from several places per frame). The debug log line
; "[cam] foreign yaw found before N of M writes" tells whether any writer is still unaccounted for.
OwnChrCam=true
; (OwnHeadPosition / AddHmdPosition / RealHmdPositionScale / HmdYawInGameCamera were removed:
;  they only existed to negotiate with R.E.A.L. over who applied the headset offset. ERVR now owns
;  rendering, so the eye lands exactly where it writes the camera.)
; Play-space re-centring. The runtime reports your head relative to wherever it last recentred, and everything we
; place (camera, hands, body) is then rotated by the camera yaw - so standing half a metre off centre makes the view
; swing sideways every time you turn with the stick, and shoves the body with it. ERVR keeps its own origin that
; slowly follows your head: leaning and ducking still move the view, walking around the room does not. Without it,
; standing half a metre off the runtime origin makes the eye orbit the body on every stick turn ("the camera drifts
; sideways when I rotate"). Cost: a deliberate lean is absorbed over RecenterSeconds.
Recenter=true
; Seconds for the slow re-centring. Bigger = leans persist longer; 0 = hard lock (no positional head tracking at all).
RecenterSeconds=2.0
; Never allow more than this many meters between your head and the character.
RecenterMaxRadius=0.75
; Also absorb vertical drift, so the view stays at EyeHeight whatever your real height is.
RecenterHeight=true
; How the rendered body is posed:
;   vr   = the whole rig is written from a captured standing pose every frame, arms/torso from your controllers on
;          top. NO game animation ever poses the body - rolls, attacks, runs still MOVE the character (root motion
;          is untouched, so a dodge still displaces you) but they no longer play on the rig or drag the camera.
;          The pose is re-captured whenever you stand still for a second, so idle/crouch/sit stances come through.
;   game = old behaviour: the game's animations play and ERVR layers the arm IK on top (animations fight the arms).
PoseMode=vr
; Keep the character's body facing the camera (strafe mode) unless a real enemy is locked on, so the arms can always
; reach your hands when walking backwards / sideways.
FaceCamera=true
; How that is done:
;   auto   = strafe when PoseMode=vr, else lock (default)
;   strafe = only set the "strafing movement" flag. The game's lock-on state stays off - important, because forcing
;            it (the old way) engages the game's LOCK-ON CAMERA, a camera writer ERVR does not hook: it orbits the
;            view around the character while strafing and eats right-stick turns.
;   lock   = old behaviour: force the lock-on state onto a fake far-away target.
;   off    = leave the game alone (body free-turns toward the move direction).
FaceCameraMode=auto
; How far ahead the fake lock-on point sits (meters, FaceCameraMode=lock only). The game's lock-on camera nudges its
; yaw to frame this point and we read that yaw back, so a close target turns strafing into a slow, self-feeding
; rotation. Keep this large.
LockTargetDistance=100
HideHead=true
; Hide the sheath/scabbard slots (the held weapons themselves are never hidden).
HideSheathedWeapons=false
; Write where you look into the player's aim matrix (bows / spells aim with your head).
WriteAim=true
; Controller-driven arms.
HandTracking=true
; Where controller positions are measured from: head (relative to the headset - safest), tracking (raw tracking origin),
; floor (raw minus EyeHeight).
HandOrigin=head
; Distance from the controller grip pose back to the wrist bone (meters).
HandBackOffset=0.06
; Calibration rotation controller -> hand bone (degrees). Adjust if the weapon points the wrong way in your hand.
HandRotOffsetX=0
HandRotOffsetY=0
HandRotOffsetZ=0
; Elbow hint direction (relative to your facing): down / outward / backward weights.
ElbowPoleDown=1.0
ElbowPoleOut=0.6
ElbowPoleBack=0.3
; Let the arm stretch (forearm+hand bone lengths) up to this factor when your hand is beyond the character's reach.
ArmStretch=1.5
; Scale of controller offsets from the head (0.85 = bring hands 15% closer, if your arms are much longer than the character's).
HandScale=1.0
; Twist the torso so the chest always faces the camera yaw (arms stay reachable while running/turning).
; What the body - facing, shoulders, torso, elbows - turns toward: head (follows your real head yaw: physically
; turning your body turns the character too - 1:1), camera (the stick yaw only: physically turning leaves the
; body behind) or stick (CameraYawSource=ervr only: the right stick turns the body, absolute).
BodyYaw=head
; If the rendered body faces the wrong way, correct it here (180 = flipped). Debug lines print "root facing-cam".
BodyFacingOffsetDeg=0
; Smoothing of the body chasing the head (seconds, 0 = instant) and how far you can glance before it follows.
BodyYawFollowSeconds=0.25
BodyYawDeadzoneDeg=0
TorsoFaceCamera=true
; Shift the whole rig so its head bone sits under your eye: physically stepping or leaning moves the CHARACTER with
; you instead of sliding the camera off a body that stays put. The physics root (collision) does not move and the
; shift is clamped by the three limits below. With PoseMode=vr this is measured against the captured template, so
; it cannot feed back on itself; vertical only follows your own crouch, so the rig never floats off the ground.
BodyFollowsHead=true
BodyFollowMaxHorizontal=0.6
BodyFollowMaxDown=0.6
BodyFollowMaxUp=0.25
; head = keep the character's head bone at the eye (whatever the animation does) | root = shift by the headset offset only.
BodyAnchor=head
; Yaw the whole rendered skeleton to BodyYaw every frame, so the shoulders face where your head/body faces right now
; instead of waiting for the game to turn the character (idle it only turns for large angles).
BodyRotate=true
; Which character root the camera anchor and arm bones are built on: physics = the physics module (final BEFORE
; the camera step; the model matrix is rebuilt FROM it afterwards, so reading the matrix at camera time gives last
; frame's position - one frame of camera lag, most visible while strafing); model = position from the ChrCtrl model
; matrix, rotation from physics; modelmatrix = both from the matrix.
ArmRootSource=physics
; Strafe mode: pin the character's physics facing to BodyYaw every frame, so walking toward your gaze is full-speed
; forward movement instead of a side-step (the game picks run vs strafe from the angle between move direction and
; facing). Directional dodges are unaffected. Set false if ladders or mounts misbehave.
PinBodyFacing=true
; Solve the arms on every Havok update instead of once per rendered frame. false is cheaper but a later animation
; evaluation in the same frame can throw the pose away (hands snap back to the run animation).
ArmSolveEveryCall=true
BoneTorso=Spine
; Bone names (c0000). If ERVR.log shows "arms L(-1,...)" look at the "[skel]" dump and fix these.
BoneLeftUpperArm=L_UpperArm
BoneLeftForearm=L_Forearm
BoneLeftHand=L_Hand
BoneRightUpperArm=R_UpperArm
BoneRightForearm=R_Forearm
BoneRightHand=R_Hand
DumpSkeleton=true
; Diagnostic (leave false): flip to true DURING PLAY to page-protect the live pose buffer for ~1 second and log the
; code address (RVA) of everything that reads or writes it ("[posescan]" lines). Expect a brief hitch. One scan per
; false->true flip.
PoseWriterScan=false
; Per-second "[fp]" debug lines with positions (needs LogLevel=debug).
Debug=false

[Combat]
; Physical melee. Instead of pressing R1/R2 (which plays an attack animation with animation-timed hitboxes),
; ERVR fires the game's own TAE "AttackBehavior" event on your character every frame while your controller is
; swinging. The game does the rest exactly as for a real attack: BehaviorParam/AtkParam lookup for the equipped
; weapon, capsule sweep along the weapon (which follows your hand), damage, poise, status, hitstop, stamina cost,
; one hit per enemy per swing. No attack animation plays; your arms are the attack.
;   Mode=buttons  : old behaviour, swings press LightAttackButton/HeavyAttackButton/LeftSwingButton ([Gestures]).
;   Mode=physical : swings invoke attacks directly (needs the judge ids below, learned or configured).
;   Mode=auto     : buttons until the light-attack judge id has been learned, then physical (default).
; Judge ids: which BehaviorParam_PC row (= which attack of the equipped weapon) a swing invokes. Observed in
; ER 1.16: R1 chain = 0 / 10 / 20, R2 = 100 (105 for some charged variants), left hand = 0. These defaults work
; out of the box; with Learn=true ERVR still refines them from the events the game fires right after it pressed
; R1 / R2 / L1 in buttons mode ("[combat] learned ..." in ERVR.log). SaveLearned=true (opt-in) writes learned
; ids back into this file. Two-handing has its own animations: set Mode=buttons for a moment to re-learn.
Enabled=true
Mode=auto
LightJudgeId=0
HeavyJudgeId=100
LeftJudgeId=0
Learn=true
SaveLearned=false
; While physical combat is active never send the light/heavy buttons (RB/RT): trigger and grip would otherwise
; play attack animations that move your arms. Menus still get them (tab switching).
BlockAttackButtons=true
; Diagnostic: rotate the attack slot (AttackIndex 0..N-1) per swing. Try 4 if enemies stop taking hits after the first.
AttackIndexRotate=0
; Swing detection uses the WEAPON TIP speed: controller velocity + angular velocity x reach (m).
WeaponReachRight=0.8
WeaponReachLeft=0.5
SwingOnSpeed=3.0
SwingOffSpeed=1.5
HeavySwingSpeed=6.0
; Controller (hand) speed required to start a swing; rejects wrist flicks that only move the tip.
MinHandSpeed=0.8
; Seconds to watch the peak before choosing light/heavy; hard limit of one attack; pause between swings.
ArmWindow=0.06
MaxSwingSeconds=0.6
Cooldown=0.25
; Left-hand swings attack with the left-hand weapon (shield bash / offhand weapon).
LeftHand=true
; No stamina = no swing (long buzz on that hand). The game's own stamina cost per attack still applies.
RequireStamina=true
MinStamina=1
; Stamina ERVR itself takes per swing on top of whatever the game charges (0 = game only). Use if swings feel free.
ExtraStaminaLight=0
ExtraStaminaHeavy=0
ExtraStaminaLeft=0
; Swallow AttackBehavior events coming from animations (a stray R1, jump attack) while physical combat is active.
SuppressAnimAttacks=false
; Log every swing start/end and every AttackBehavior the game fires for you (needs LogLevel=debug).
Debug=false

[Cheats]
; Offline testing helpers. SetAllStats=N raises every stat below N to N once (level adjusted) - it edits the save.
SetAllStats=0

[MenuNav]
; Menu navigation: while a game menu is open the LEFT stick becomes a held D-pad (tilt = press, keep tilted to
; auto-repeat), stick movement is not sent, and swing gestures are muted (a swing in the inventory would switch tabs).
; The map is deliberately excluded (the stick pans there).
Enabled=true
; Stick deflection that counts as a D-pad press.
Threshold=0.55
; How ERVR knows a menu is open:
;   1. MenuChain below (memory flag, exact) if set;
;   2. otherwise, if FollowStartButton=true, our own START press turns it on and the next START/BACK turns it off;
;   3. hold the left stick click for ToggleHold seconds WITHOUT tilting = toggle by hand (0 disables). Left controller buzzes:
;      long = on, short = off. Menus opened by other means (sites of grace, NPC shops, level-up) need this or MenuChain.
FollowStartButton=true
ToggleHold=0.5
Haptics=true
; Memory flag (optional). MenuAOB resolves the CSMenuMan* global (verified once on eldenring.exe 2.6.2.0).
; MenuChain = pointer chain from that global to a byte that is nonzero while a menu is open, e.g. "0x8,0x1F0".
; To find it: set Scan=true and LogLevel=info, open/close the inventory a few times, and look for "[menuscan] +0x...:"
; lines that flip once on open and once on close; then set MenuChain=0x<thatoffset> (offsets inside the object need
; only one hop; a nested object needs "0x<ptr>,0x<field>"). Set Scan=false afterwards.
MenuAOB=48 8B 0D ?? ?? ?? ?? 48 8B 53 08 48 8B 92 D8 00 00 00 48 83 C4 20 5B
MenuAOBOffset=3
MenuAOBInstrLen=7
MenuChain=
Scan=false
ScanSize=0x400

[Patches]
; In-process port of uberhalit's EldenRingFpsUnlockAndMore (MIT). 0 leaves the game's 60 fps
; cap alone; 30..360 rewrites the frame-tick constant (limiter AND simulation step move
; together, so the game runs slow-motion whenever it cannot actually hold the target - pick
; something your GPU sustains; with true stereo the draw cost is doubled). Also removes the
; forced 60 Hz on exclusive-fullscreen resolution changes. Applied once at startup.
FpsTarget=0

[Experimental]
; M2 spike (true stereo): locate ELDEN RING's frame task-group table and dump it to the log
; under "[m2]". Read-only reconnaissance - it scans process memory once, costs a second or
; two at startup, and changes nothing. Needed to work out whether the draw phase can be
; re-driven with a second camera.
TaskProbe=false
; The rest of the M2 instrumentation (all default off; each needs TaskProbe=true):
;   TaskRegisterTest   - register no-op probe tasks into FrameBegin/GameSceneDraw/DrawEnd and
;                        log their per-frame cadence and dt.
;   TaskQueueProbe     - hook CSTask::queue_tasks (the frame driver) and log caller/timing.
;   TaskDumpLists      - dump every task group's registered tasks with RTTI class names.
;   TaskDoublePumpTest - A/B the draw-only second engine pass (the full-stereo mechanism).
;   TaskToggle=<name> + TaskToggleMode/Delay/Seconds/Cycles - gate one group on/off in cycles.
TaskRegisterTest=false
TaskQueueProbe=false
TaskDumpLists=false
TaskDoublePumpTest=false
TaskToggle=
; Unattended runs: after the autopilot reaches the world, keep panning the camera (right
; stick only, no interactions) for this many seconds so screenshots show motion.
AutoPilotWiggleSeconds=0
; Hand aim: while holding right grip, camera yaw/pitch follow the right controller (bows, spells).
; Needs a pointer to the game's camera angles, which changes with game patches. Leave off unless you
; supply the values below (see README "Hand aim").
HandAim=false
CameraAOB=
CameraAOBOffset=3
CameraAOBInstrLen=7
CameraChain=
CameraYawOffset=0
CameraPitchOffset=4
HandAimStrength=1.0
