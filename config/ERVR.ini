; ERVR - motion controls for ELDEN RING (companion to R.E.A.L. VR)
; Edit while the game runs: most keys hot-reload within a second.

[General]
Enabled=true
; debug | info | warn | error   (debug prints a heartbeat with controller values every 5 s)
LogLevel=info
; auto | oculus | openvr  - which in-process runtime to piggyback on. auto tries Oculus (Link/Air Link) then SteamVR.
VRRuntime=auto
PollHz=250

[Buttons]
; Touch button -> XInput button. Names: A B X Y LB RB LT RT LS RS START BACK DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT none
; Default ELDEN RING bindings: A=interact/confirm B=dodge/sprint X=use item Y=event/two-hand
;   LB=guard RB=light attack LT=skill RT=heavy attack LS=crouch RS=lock-on START=menu BACK=map
A=A
B=B
X=X
Y=Y
LeftStickClick=LS
RightStickClick=RS
; Left "menu" button: tap = START, hold >= MenuHoldForBack seconds = BACK (map).
Menu=START
MenuHoldForBack=0.45
LeftTrigger=LB
RightTrigger=RB
LeftGrip=LT
RightGrip=RT
TriggerThreshold=0.55
GripThreshold=0.60
; Hold left stick click + tilt = D-pad (switch spells / weapons / items). Tap = LS (crouch).
LeftGripPlusStickIsDpad=true

[Sticks]
Deadzone=0.15
Swap=false
RightSensitivity=1.0

[Gestures]
; Swing the right controller to attack: above LightAttackSpeed (m/s) = light attack, above HeavyAttackSpeed = heavy.
; Swing the left controller to send LeftSwingButton (parry / shield bash / offhand attack).
Enabled=true
LightAttackSpeed=2.2
HeavyAttackSpeed=4.0
LeftSwingSpeed=2.4
LightAttackButton=RB
HeavyAttackButton=RT
LeftSwingButton=LB
Cooldown=0.35
PressDuration=0.09
; Only detect swings while that hand's grip is held (avoids accidental swings while gesturing).
RequireGrip=false
Haptics=true

[Movement]
; Move in the direction the LEFT controller points instead of where you look.
HandRelative=false
; Convert right-stick X into short pulses (pairs well with R.E.A.L.'s head-look).
SnapTurn=false
SnapTurnPulseSeconds=0.08
SnapTurnRepeatSeconds=0.30

[Haptics]
RumbleToControllers=true
RumbleScale=1.0

[FirstPerson]
; ERVR takes over the game camera (first person anchored to your character) and drives the arm bones from the
; controllers so the equipped weapons follow your hands. R.E.A.L. keeps doing the stereo rendering + head tracking.
; Only active on eldenring.exe 2.6.2.0 (game 1.16.2) or when the pattern fallbacks resolve; check ERVR.log "[game]".
Enabled=true
; Camera height above the character's root (meters).
EyeHeight=1.60
; How the first-person camera is handed to the game:
;   pre         write it into the game's character camera, then let the game's camera step run (R.E.A.L.-friendly, default)
;   post        run the game's camera step, then overwrite the final camera
;   block       replace the camera step entirely (erfps2 style; R.E.A.L. falls back to a flat screen with this)
;   passthrough do nothing to the camera (diagnostics: logs the game's own matrices)
CameraMode=pre
; Rotation written into the game camera: yaw (recommended: R.E.A.L. adds your head rotation on top),
; game (also keep the game's pitch), hmd (write the full headset orientation - use only if R.E.A.L. does NOT add it).
CameraRotation=yaw
; Add the headset positional offset ourselves. Leave false unless the view does not move when you lean.
AddHmdPosition=false
; Leave false (verified: R.E.A.L. does not put head yaw into the game camera). true = hands drift opposite to head turns.
HmdYawInGameCamera=false
; Keep the character's body facing the camera (strafe mode) unless a real enemy is locked on, so the arms can always
; reach your hands when walking backwards / sideways.
FaceCamera=true
HideHead=true
; Hide the sheath/scabbard slots (the held weapons themselves are never hidden).
HideSheathedWeapons=false
; Write where you look into the player's aim matrix (bows / spells aim with your head).
WriteAim=true
; Controller-driven arms.
HandTracking=true
; Where controller positions are measured from: head (relative to the headset - safest), tracking (raw tracking origin),
; floor (raw minus EyeHeight).
HandOrigin=head
; Distance from the controller grip pose back to the wrist bone (meters).
HandBackOffset=0.06
; Calibration rotation controller -> hand bone (degrees). Adjust if the weapon points the wrong way in your hand.
HandRotOffsetX=0
HandRotOffsetY=0
HandRotOffsetZ=0
; Elbow hint direction (relative to your facing): down / outward / backward weights.
ElbowPoleDown=1.0
ElbowPoleOut=0.6
ElbowPoleBack=0.3
; Let the arm stretch (forearm+hand bone lengths) up to this factor when your hand is beyond the character's reach.
ArmStretch=1.5
; Scale of controller offsets from the head (0.85 = bring hands 15% closer, if your arms are much longer than the character's).
HandScale=1.0
; Twist the torso so the chest always faces the camera yaw (arms stay reachable while running/turning).
TorsoFaceCamera=true
BoneTorso=Spine
; Bone names (c0000). If ERVR.log shows "arms L(-1,...)" look at the "[skel]" dump and fix these.
BoneLeftUpperArm=L_UpperArm
BoneLeftForearm=L_Forearm
BoneLeftHand=L_Hand
BoneRightUpperArm=R_UpperArm
BoneRightForearm=R_Forearm
BoneRightHand=R_Hand
DumpSkeleton=true
; Per-second "[fp]" debug lines with positions (needs LogLevel=debug).
Debug=false

[MenuNav]
; Menu navigation: while a game menu is open the LEFT stick becomes a held D-pad (tilt = press, keep tilted to
; auto-repeat), stick movement is not sent, and swing gestures are muted (a swing in the inventory would switch tabs).
; The map is deliberately excluded (the stick pans there).
Enabled=true
; Stick deflection that counts as a D-pad press.
Threshold=0.55
; How ERVR knows a menu is open:
;   1. MenuChain below (memory flag, exact) if set;
;   2. otherwise, if FollowStartButton=true, our own START press turns it on and the next START/BACK turns it off;
;   3. hold the left stick click for ToggleHold seconds WITHOUT tilting = toggle by hand (0 disables). Left controller buzzes:
;      long = on, short = off. Menus opened by other means (sites of grace, NPC shops, level-up) need this or MenuChain.
FollowStartButton=true
ToggleHold=0.5
Haptics=true
; Memory flag (optional). MenuAOB resolves the CSMenuMan* global (verified once on eldenring.exe 2.6.2.0).
; MenuChain = pointer chain from that global to a byte that is nonzero while a menu is open, e.g. "0x8,0x1F0".
; To find it: set Scan=true and LogLevel=info, open/close the inventory a few times, and look for "[menuscan] +0x...:"
; lines that flip once on open and once on close; then set MenuChain=0x<thatoffset> (offsets inside the object need
; only one hop; a nested object needs "0x<ptr>,0x<field>"). Set Scan=false afterwards.
MenuAOB=48 8B 0D ?? ?? ?? ?? 48 8B 53 08 48 8B 92 D8 00 00 00 48 83 C4 20 5B
MenuAOBOffset=3
MenuAOBInstrLen=7
MenuChain=
Scan=false
ScanSize=0x400

[Experimental]
; Hand aim: while holding right grip, camera yaw/pitch follow the right controller (bows, spells).
; Needs a pointer to the game's camera angles, which changes with game patches. Leave off unless you
; supply the values below (see README "Hand aim").
HandAim=false
CameraAOB=
CameraAOBOffset=3
CameraAOBInstrLen=7
CameraChain=
CameraYawOffset=0
CameraPitchOffset=4
HandAimStrength=1.0
