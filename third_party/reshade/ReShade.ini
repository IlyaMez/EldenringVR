; ReShade defaults shipped with ERVR. ReShade is only the host that hands ERVR the game's D3D12
; frames - no effects or shaders are needed or installed. Home opens ReShade's overlay (on the
; monitor, not in the headset); PrintScreen saves the raw back buffer next to the exe.
; install.ps1 and the release zip never overwrite an existing ReShade.ini.
[GENERAL]
PerformanceMode=1
NoDebugInfo=1
EffectSearchPaths=.\reshade-shaders\Shaders
TextureSearchPaths=.\reshade-shaders\Textures
PresetPath=.\ReShadePreset.ini

[ADDON]
AddonPath=.\reshade-addons
DisabledAddons=

[INPUT]
InputProcessing=2
KeyOverlay=36,0,0,0
KeyScreenshot=44,0,0,0

[OVERLAY]
TutorialProgress=4
ShowFPS=0
ShowClock=0
ShowScreenshotMessage=1
AutoSavePreset=1

[SCREENSHOT]
FileFormat=1
SavePath=.\
