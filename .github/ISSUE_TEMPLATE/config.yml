blank_issues_enabled: false
contact_links:
  - name: Question, tuning help, or "is this supposed to happen?"
    url: https://github.com/IlyaMez/EldenringVR/discussions
    about: Anything that is not a reproducible bug goes in Discussions. Check the pinned Known Issues post first.
  - name: Do I need R.E.A.L. VR?
    url: https://github.com/IlyaMez/EldenringVR/blob/main/THIRD_PARTY.md
    about: No. ERVR is standalone and ships ReShade. If R.E.A.L. is installed, remove its files first - both want to be dxgi.dll.
  - name: Anti-cheat, online play, or multiplayer
    url: https://github.com/IlyaMez/EldenringVR/blob/main/README.md
    about: Out of scope permanently. ERVR is for offline, EAC-disabled play only.
