contact_links:
  - name: Question, setup help, or "is this supposed to happen?"
    url: https://discord.gg/x27ZXDpdNt
    about: Ask in #ervr-help on the Discord, with Game/ERVR/ERVR.log. Check its pinned Known issues first.
  - name: Do I need R.E.A.L. VR?
    url: https://github.com/IlyaMez/EldenringVR/blob/main/THIRD_PARTY.md
    about: No. ERVR is standalone and ships ReShade. The launcher parks R.E.A.L.'s files, since both want to be dxgi.dll.
  - name: Anti-cheat or FromSoftware's online play
    url: https://github.com/IlyaMez/EldenringVR/blob/main/docs/PLAYERS.md#before-you-start
    about: Out of scope permanently. ERVR is for offline play and Seamless Co-op, never with EAC.
